# FutureBench: Tages-Snapshot, Kosten-Digest, Invarianten-Check, Janitor.
#
# Prüft täglich die Lock-Invariante (keine Prediction nach dem Lock ihres
# Events) – die Grundlage der Zitierfähigkeit wird gemessen, nicht angenommen.
name: Arena Analytics

on:
  schedule:
    - cron: '43 2 * * *' # täglich 02:43 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arena-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Snapshot und Digest
        run: node --experimental-strip-types scripts/arena/jobs/analytics.mts
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      # Katalog-Abgleich laeuft hier mit, nicht in einem eigenen Workflow:
      # GitHub sperrt den erstmaligen Lauf neu hinzugefuegter Workflows in
      # diesem Repo (conclusion action_required, keine Jobs), und dieser Job
      # traegt den Anbieter-Schluessel ohnehin schon. Ein GET pro Anbieter
      # und Tag kostet nichts.
      # Faellt der Abgleich aus, soll der Snapshot trotzdem gruen bleiben -
      # deshalb continue-on-error.
      - name: Modellkatalog abgleichen
        continue-on-error: true
        run: node --experimental-strip-types scripts/arena/jobs/catalog.mts
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
