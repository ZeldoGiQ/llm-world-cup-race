# FutureBench: Tages-Snapshot, Kosten-Digest, Invarianten-Check, Janitor.
#
# Prüft täglich die Lock-Invariante (keine Prediction nach dem Lock ihres
# Events) – die Grundlage der Zitierfähigkeit wird gemessen, nicht angenommen.
name: Arena Analytics

on:
  schedule:
    - cron: '43 2 * * *' # täglich 02:43 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  # Zum Anstossen des Vorhersagelaufs, wenn der Katalog ein Modell angelegt hat.
  actions: write

concurrency:
  group: arena-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Snapshot und Digest
        run: node --experimental-strip-types scripts/arena/jobs/analytics.mts
        env:
          # Jedes Secret einzeln, mit Absicht. Das fruehere
          #   SECRETS_CONTEXT: ${{ toJson(secrets) }}
          # kippte alle Secrets auf einmal in eine Variable - exakt die Signatur,
          # mit der Credential-Diebstahl-Malware arbeitet, und GitHubs Heuristik
          # hat die Datei deshalb als "may be malicious" gesperrt. Jeder Lauf
          # endete ohne einen einzigen Job. Nicht hinterlegte Secrets ergeben
          # hier einen Leerstring, den der Leser wie "fehlt" behandelt.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE: ${{ secrets.SUPABASE }}
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}

      # Katalog-Abgleich laeuft hier mit, nicht in einem eigenen Workflow:
      # GitHub sperrt den erstmaligen Lauf neu hinzugefuegter Workflows in
      # diesem Repo (conclusion action_required, keine Jobs), und dieser Job
      # traegt den Anbieter-Schluessel ohnehin schon. Ein GET pro Anbieter
      # und Tag kostet nichts.
      # Faellt der Abgleich aus, soll der Snapshot trotzdem gruen bleiben -
      # deshalb continue-on-error.
      - name: Modellkatalog abgleichen
        id: katalog
        continue-on-error: true
        run: node --experimental-strip-types scripts/arena/jobs/catalog.mts
        env:
          # Jedes Secret einzeln, mit Absicht. Das fruehere
          #   SECRETS_CONTEXT: ${{ toJson(secrets) }}
          # kippte alle Secrets auf einmal in eine Variable - exakt die Signatur,
          # mit der Credential-Diebstahl-Malware arbeitet, und GitHubs Heuristik
          # hat die Datei deshalb als "may be malicious" gesperrt. Jeder Lauf
          # endete ohne einen einzigen Job. Nicht hinterlegte Secrets ergeben
          # hier einen Leerstring, den der Leser wie "fehlt" behandelt.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE: ${{ secrets.SUPABASE }}
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}

      # Hat der Abgleich ein neues Modell angelegt, tippt es sofort mit statt
      # beim naechsten Stundentakt (den GitHub in diesem Repo oft um Stunden
      # verschiebt). Ein per Token ausgeloester workflow_dispatch erzeugt
      # regulaer einen Lauf.
      - name: Vorhersagelauf fuer neue Modelle anstossen
        if: steps.katalog.outputs.enrolled != ''
        run: gh workflow run arena-predict.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
