# FutureBench: exportiert die DB nach public/arena-data/** und committet.
#
# Der EINZIGE Workflow, der committet (Single Writer, keine Push-Races). Der
# Commit ist der Lock-Beweis: Predictions liegen damit öffentlich und
# zeitgestempelt im Git, bevor das Event beginnt.
#
# Benötigt: SUPABASE_URL, SUPABASE_SERVICE_KEY
name: Arena publizieren

on:
  schedule:
    - cron: '41 * * * *' # stündlich (UTC), versetzt zu predict um :07
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arena-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export aus Supabase
        run: node --experimental-strip-types scripts/arena/jobs/publish.mts
        env:
          # Wie bei allen Arena-Jobs: Secrets werden zur Laufzeit nachgeschlagen,
          # damit kein Workflow angefasst werden muss, wenn ein Secret dazukommt
          # oder anders heißt. GitHub maskiert die Werte in Logs weiterhin.
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Änderungen committen und pushen
        run: |
          # Erst stagen, dann den Index prüfen. `git diff` allein sieht nur
          # getrackte Dateien - eine neu angelegte Datei (etwa die erste
          # failures.json einer Kategorie) wäre unsichtbar und der Commit
          # würde ausbleiben.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/arena-data src/arena/data/models.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen - nichts zu committen."
          else
            git commit -m "chore(arena): Daten aktualisieren (auto)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi
