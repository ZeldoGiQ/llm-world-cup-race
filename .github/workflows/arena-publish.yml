# FutureBench: exportiert die DB nach public/arena-data/** und committet.
#
# Der EINZIGE Workflow, der committet (Single Writer, keine Push-Races). Der
# Commit ist der Lock-Beweis: Predictions liegen damit öffentlich und
# zeitgestempelt im Git, bevor das Event beginnt.
#
# Benötigt: SUPABASE_URL, SUPABASE_SERVICE_KEY
name: Arena publizieren

on:
  schedule:
    - cron: '41 * * * *' # stündlich (UTC), versetzt zu predict um :07
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arena-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export aus Supabase
        run: node --experimental-strip-types scripts/arena/jobs/publish.mts
        env:
          # Jedes Secret einzeln, mit Absicht. Das fruehere
          #   SECRETS_CONTEXT: ${{ toJson(secrets) }}
          # kippte alle Secrets auf einmal in eine Variable - exakt die Signatur,
          # mit der Credential-Diebstahl-Malware arbeitet, und GitHubs Heuristik
          # hat die Datei deshalb als "may be malicious" gesperrt. Jeder Lauf
          # endete ohne einen einzigen Job. Nicht hinterlegte Secrets ergeben
          # hier einen Leerstring, den der Leser wie "fehlt" behandelt.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE: ${{ secrets.SUPABASE }}
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}

      - name: Änderungen committen und pushen
        id: commit
        run: |
          # Erst stagen, dann den Index prüfen. `git diff` allein sieht nur
          # getrackte Dateien - eine neu angelegte Datei (etwa die erste
          # failures.json einer Kategorie) wäre unsichtbar und der Commit
          # würde ausbleiben.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/arena-data src/arena/data/models.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen - nichts zu committen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(arena): Daten aktualisieren (auto)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Community-Discord: Ranglisten mit Share-Karte, nur wenn sich Daten
      # geaendert haben. Die Karten entstehen ausschliesslich im Site-Build
      # (Vite-Globs), deshalb der Build hier - nach dem Push, damit der
      # Lock-Beweis nicht auf den Build wartet.
      - name: Seite bauen (Share-Karten)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Community-Discord
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node --experimental-strip-types scripts/arena/jobs/community.mts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE: ${{ secrets.SUPABASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
