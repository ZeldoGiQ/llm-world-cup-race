# Wendet neue SQL-Migrationen automatisch an, sobald sie gepusht werden.
# Ersetzt das Kopieren in den Supabase-SQL-Editor vollständig – bis auf die
# einmalige 000_migrations_bootstrap.sql, die die Funktion dafür erschafft.
name: Arena Migrationen

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arena/sql/**'
  workflow_dispatch: {} # manueller Start über den Actions-Tab

permissions:
  contents: read

concurrency:
  group: arena-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Migrationen anwenden
        run: node --experimental-strip-types scripts/arena/jobs/migrate.mts
        env:
          # Jedes Secret einzeln, mit Absicht. Das fruehere
          #   SECRETS_CONTEXT: ${{ toJson(secrets) }}
          # kippte alle Secrets auf einmal in eine Variable - exakt die Signatur,
          # mit der Credential-Diebstahl-Malware arbeitet, und GitHubs Heuristik
          # hat die Datei deshalb als "may be malicious" gesperrt. Jeder Lauf
          # endete ohne einen einzigen Job. Nicht hinterlegte Secrets ergeben
          # hier einen Leerstring, den der Leser wie "fehlt" behandelt.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE: ${{ secrets.SUPABASE }}
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
