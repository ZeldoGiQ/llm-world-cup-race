# Holt alle 10 Minuten die aktuellen WM-Ergebnisse von football-data.org
# und committet public/data/matches.json bei Änderungen. Der Push löst
# automatisch ein Vercel-Redeploy aus -> neue Ergebnisse sind live.
#
# Benötigt das Repo-Secret FOOTBALL_DATA_API_KEY:
#   gh secret set FOOTBALL_DATA_API_KEY
#
# Hinweise:
# - GitHub führt Cron-Jobs nicht sekundengenau aus (Verzögerungen von einigen
#   Minuten sind normal).
# - Bei Repos ohne Aktivität deaktiviert GitHub schedule-Workflows nach
#   60 Tagen; die regelmäßigen Auto-Commits verhindern das während des Turniers.
name: Ergebnisse aktualisieren

on:
  schedule:
    - cron: '*/10 * * * *' # alle 10 Minuten (UTC)
  workflow_dispatch: {} # manueller Start über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Ergebnisse von football-data.org holen
        run: node scripts/fetch-results.mjs
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Änderungen committen und pushen
        run: |
          if git diff --quiet -- public/data/matches.json; then
            echo "Keine Änderungen - nichts zu committen."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/matches.json
            git commit -m "chore: Spielergebnisse aktualisieren (auto)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi
