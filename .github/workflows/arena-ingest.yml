# FutureBench: Feeds legen neue Events an (idempotent).
#
# Läuft dreimal täglich, damit neue Spielpläne früh genug im System sind, dass
# die Modelle im vollen Vorhersagefenster tippen können. Ein fehlschlagender
# Feed stoppt die anderen nicht.
name: Arena Events beschaffen

on:
  schedule:
    - cron: '17 4,12,20 * * *' # 3x täglich (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arena-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Feeds abrufen
        run: node --experimental-strip-types scripts/arena/jobs/ingest.mts
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      # ---------------------------------------------------------------------
      # NOTBEHELF, bewusst hier und nicht in arena-analytics.yml.
      #
      # Der Analytics-Workflow wird von GitHub blockiert: Jeder Lauf endet
      # sofort mit conclusion "action_required" und ohne einen einzigen Job –
      # auch bei manuellem Anstoss durch den Repo-Eigentuemer. Repo-Rechte,
      # Rulesets und Environments sind unauffaellig, die Freigabe-API greift
      # nur bei Fork-PRs. Solange das nicht in der GitHub-Oberflaeche
      # freigegeben ist, laufen diese beiden Schritte NIE.
      #
      # Was dadurch ausfiel: der taegliche Kosten-Digest, der Janitor – und
      # vor allem der Invarianten-Check, der die Lock-Zusage misst statt sie
      # anzunehmen. Das ist die Grundlage der Zitierfaehigkeit; sie
      # ungeprueft zu lassen ist teurer als ein unsauber einsortierter
      # Schritt.
      #
      # Beide Schritte laufen mit continue-on-error, damit die
      # Event-Beschaffung gruen bleibt, wenn einer von ihnen scheitert.
      # Sobald arena-analytics wieder laeuft, gehoeren sie dorthin zurueck.
      # ---------------------------------------------------------------------
      - name: Snapshot und Digest (Ersatz fuer den blockierten Analytics-Lauf)
        continue-on-error: true
        run: node --experimental-strip-types scripts/arena/jobs/analytics.mts
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Modellkatalog abgleichen
        continue-on-error: true
        run: node --experimental-strip-types scripts/arena/jobs/catalog.mts
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
